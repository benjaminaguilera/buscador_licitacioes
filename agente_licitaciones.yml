name: Agente Buscador de Licitaciones

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clonar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Actualizar pip
        run: python -m pip install --upgrade pip

      - name: 4. Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: 5. Verificar archivos
        run: |
          echo "========================================"
          echo "ARCHIVOS DEL REPOSITORIO"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "VERSION DE PYTHON"
          echo "========================================"
          python --version

          echo ""
          echo "========================================"
          echo "VERSION DE PIP"
          echo "========================================"
          python -m pip --version

          echo ""
          echo "========================================"
          echo "VERIFICANDO ARCHIVOS NECESARIOS"
          echo "========================================"

          test -f buscador_licitaciones.py
          test -f requirements.txt

          echo "OK: buscador_licitaciones.py"
          echo "OK: requirements.txt"

      - name: 6. Ejecutar buscador de licitaciones
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python buscador_licitaciones.py
