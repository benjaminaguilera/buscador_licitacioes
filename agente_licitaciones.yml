name: Agente Buscador de Licitaciones

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 12:00 UTC (09:00 AM en Chile durante horario UTC-3)
    - cron: '0 12 * * 1-5'
  # Permite ejecutar el agente manualmente desde GitHub
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el contenido del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Actualizar pip
        run: python -m pip install --upgrade pip

      - name: 4. Instalar las dependencias del proyecto
        run: python -m pip install -r requirements.txt

      - name: 5. Comprobar que los archivos existen
        run: |
          echo "Archivos del repositorio:"
          echo "========================================"
          ls -la
          echo ""
          echo "Versión de Python:"
          echo "========================================"
          python --version
          echo ""
          echo "VERSIÓN DE PIP"
          echo "========================================"
          pip --version

      - name: 6. Ejecutar el buscador de licitaciones
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python buscador_licitaciones.py
