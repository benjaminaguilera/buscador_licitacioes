name: Agente Buscador de Licitaciones

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 12:00 UTC
    # (09:00 AM en Chile durante horario UTC-3)
    - cron: '0 12 * * 1-5'

  # Permite ejecutar el agente manualmente desde GitHub
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar el contenido del repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Actualizar pip
      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      # 4. Instalar las dependencias del proyecto
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      # 5. Comprobar que los archivos existen
      - name: Verificar archivos
        run: |
          echo "================================="
          echo "ARCHIVOS DEL REPOSITORIO"
          echo "================================="
          ls -la

          echo ""
          echo "================================="
          echo "VERSIÓN DE PYTHON"
          echo "================================="
          python --version

          echo ""
          echo "================================="
          echo "VERSIÓN DE PIP"
          echo "================================="
          pip --version

      # 6. Ejecutar el buscador de licitaciones
      - name: Ejecutar agente buscador
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python buscador_licitaciones.py
