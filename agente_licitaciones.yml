name: Agente Buscador de Licitaciones

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -la

          echo ""
          echo "Version de Python:"
          python --version

          echo ""
          echo "Version de pip:"
          python -m pip --version

          echo ""
          echo "Verificando archivos necesarios..."

          if [ -f "buscador_licitaciones.py" ]; then
            echo "OK: buscador_licitaciones.py"
          else
            echo "ERROR: No existe buscador_licitaciones.py"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "OK: requirements.txt"
          else
            echo "ERROR: No existe requirements.txt"
            exit 1
          fi

      - name: Ejecutar buscador de licitaciones
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python buscador_licitaciones.py
